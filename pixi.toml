[workspace]
name = "azo-plugin-project-memory"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11"

[feature.test.dependencies]
pexpect = ">=4.9"
regex = "*"
pyyaml = "*"

[feature.test.pypi-dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "PYTHONPATH=../agent-zoo:../agent-utils/src:../tmux-pilot/src:src python -m pytest -q"

[environments]
test = ["test"]

[tool.agent-zoo.plugin]
name = "azo-plugin-project-memory"
common = ["src/project_memory.py"]
default = []
rlm = []

[tool.agent-zoo.plugin.config]
files = ["config/project_memory.json"]
